{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <a href="{{ url_for('admin_users') }}" class="back-link">&#8592; Voltar ao painel de admin</a>

  <h2>Confirm identity</h2>
  <p>This action is irreversible. Enter your administrator password to continue.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label>Password</label>
    <input type="password" name="password" required autofocus>

    <button type="submit">Confirm</button>
    <a href="{{ url_for('admin_users') }}" class="btn-secondary">Cancel</a>
  </form>
</section>
{% endblock %}
