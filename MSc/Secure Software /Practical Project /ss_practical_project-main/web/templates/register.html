{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h2>Criar conta</h2>

  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label>Username</label>
    <input type="text" name="username" required maxlength="64" autocomplete="username">

    <label>Password</label>
    <input type="password" name="password" required autocomplete="new-password">

    <label>Confirmar password</label>
    <input type="password" name="confirm_password" required autocomplete="new-password">

    <button type="submit">Criar conta</button>
  </form>

  <div style="margin-top: 1rem; text-align: center; font-size: 0.9rem; color: var(--color-muted, #666);">
    Já tens conta?
    <a href="{{ url_for('login') }}" style="color: var(--color-primary, #4f6ef7); text-decoration: none; font-weight: 600;">
      Fazer login
    </a>
  </div>
</section>
{% endblock %}
